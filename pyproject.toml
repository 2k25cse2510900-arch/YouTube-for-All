[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-for-all"
version = "0.1.0"
description = "Modular open-source framework for automated vertical video production"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "YouTube-for-All Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "google-api-python-client>=2.202.0",
    "google-auth>=2.62.2",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "google-genai>=3.2.0",
    "python-dotenv>=1.2.4",
    "pydantic>=2.14.3",
    "PyYAML>=6.0.3",
    "APScheduler>=3.11.3",
    "requests>=2.34.2",
    "tenacity>=8.2.3,<9.2.0",
    "rich>=15.0.0",
    "pillow>=13.0.0",
    "edge-tts>=7.3.1",
    "gradio-client>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "configs*", "config*", "image_generation*", "voice_and_audio*", "animation*", "video_generation*", "video_editing*", "script_generation*", "research*", "captions*"]
